[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracerag"
version = "0.4.0"
description = "A traceable and evaluation-first RAG service for technical documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed==0.8.0",
    "jieba==0.42.1",
    "openai>=1.0,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "httpx>=0.27,<1",
    "rapidocr==3.10.0",
    "pypdfium2>=4.30,<6",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
local-translation = [
    "sacremoses>=0.1,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]

[project.scripts]
tracerag = "tracerag.cli:main"

[tool.setuptools.package-data]
tracerag = ["web.html"]

[tool.setuptools.packages.find]
where = ["src"]
